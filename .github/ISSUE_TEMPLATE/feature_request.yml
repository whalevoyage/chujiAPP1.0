name: 功能建议
description: 提出与个人成长记录主线相关的改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 解决什么问题
      description: 描述当前遇到的具体困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明你希望它如何工作，以及影响的使用模式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
