import java.util.Properties

apply plugin: 'com.android.application'

def appVersion = new File(rootProject.projectDir, '../../VERSION').getText('UTF-8').trim()
def versionParts = appVersion.tokenize('.').collect { it as int }
if (versionParts.size() != 3 || versionParts.any { it >= 100 }) {
    throw new GradleException("VERSION must be x.y.z with each component below 100: ${appVersion}")
}
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

def signingProperties = new Properties()
def defaultSigningProperties = new File(System.getProperty('user.home'), '.android/chuji-release.properties')
def signingPropertiesPath = System.getenv('CHUJI_SIGNING_PROPERTIES')
def signingPropertiesFile = signingPropertiesPath ? new File(signingPropertiesPath) : defaultSigningProperties
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def releaseSigningValue = { String key ->
    System.getenv("CHUJI_${key}") ?: signingProperties.getProperty("CHUJI_${key}")
}
def releaseStoreFile = releaseSigningValue('RELEASE_STORE_FILE')
def releaseStorePassword = releaseSigningValue('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = releaseSigningValue('RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseSigningValue('RELEASE_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

def releaseTasksRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('assemblerelease') || taskName.toLowerCase().contains('bundlerelease')
}
if (releaseTasksRequested && !hasReleaseSigning) {
    throw new GradleException('Release signing is missing. Configure ~/.android/chuji-release.properties or CHUJI_RELEASE_* environment variables.')
}

android {
    namespace "com.chuji.personal"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.chuji.personal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

